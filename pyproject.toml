[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.51"
description = "Agent evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click",
  # NOTE: inspect-ai is deliberately NOT a base dependency. It is only needed by
  # the scoring path (agenteval.score / .log / .summary / .leaderboard); the
  # config/EvalConfig/io/repro "contract" that solve environments import is
  # inspect-free. Keeping inspect out of the base install lets a solver env
  # (e.g. astabench solve, which needs a newer inspect for inspect-swe) depend on
  # agent-eval without the ==0.3.203 pin winning uv's re-resolution and
  # downgrading its runtime. See allenai/gas2own#346. Install the `scoring`
  # (or `leaderboard`) extra to get inspect for scoring.
  # pin litellm so that we know what model costs we're using
  # see the Development.md doc before changing
  "litellm>=1.67.4.post1,<=1.88.1",
  "pydantic>=2.0.0",
  # For leaderboard
  "huggingface_hub",
  "pyarrow",
  "datasets",
]

[project.urls]
Homepage = "https://github.com/allenai/agent-eval"

[project.optional-dependencies]
dev = [
  "black==24.2.0",
  "isort",
  "autoflake",
  "flake8",
  "flake8-pyproject",
  "flake8-pep585",
  "flake8-new-union-types",
  "pytest",
  "pytest-asyncio",
  "mypy==1.15",
  "types-PyYAML",
  "types-setuptools",
  "pandas-stubs",
  "types-seaborn"
]
# Scoring dependencies. inspect-ai is required to read .eval logs and compute
# scores; it lives here (not in base) so solve-only consumers stay inspect-free.
# Pin to tested version; see allenai/nora-issues#2733 for upgrade history.
scoring = [
  "inspect-ai==0.3.203",
]
# Leaderboard view dependencies (scoring + plotting)
leaderboard = [
  "agent-eval[scoring]",
  "seaborn",
  "matplotlib",
  "pandas"
]

[project.scripts]
agenteval = "agenteval.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "leaderboard: tests that require leaderboard dependencies"
]

[tool.flake8]
select = [
  "F", # Logical errors
  "PEA", # flake8-pep585 - enforce modern collection type hints (Dict -> dict, List -> list, etc.)
  "NU", # flake8-new-union-types - enforce X | Y instead of Union[X, Y] and X | None instead of Optional[X]

  # Serious "E" errors
  "E721", # `type(x) == <t>` instead of `isinstance(x, <t>)`
  "E901", "E902", "E999" # syntax errors
]

ignore = [
  "E501",  # line too long
  "F401",  # module imported but unused
  "F541",  # f-string is missing placeholders
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"agenteval.leaderboard" = ["dataset_features.yml"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
