name: "CI Tests"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # The core suite exercises the scoring path (score.py/log.py) and tests/conftest.py
        # imports inspect_ai, so it needs the scoring extra. inspect-ai is no longer a base
        # dependency (moved to the scoring extra; see pyproject / allenai/gas2own#346).
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,scoring]

      - name: Check Code Style
        run: make code-check

      - name: Run core tests
        run: pytest -m "not leaderboard" --maxfail=1 --disable-warnings -q

  test-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies with leaderboard extras
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,leaderboard]

      - name: Run leaderboard tests
        run: pytest -m leaderboard --maxfail=1 --disable-warnings -q
